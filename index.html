<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PokéBattle</title>
        <link rel="stylesheet" href="./src/css/styles.css">
    </head>

    <body>
        <main>
            <section class="selection">
                <div class="selection-header">
                    <p>FORMA TU EQUIPO</p>
                    <h1>Elige tus Pokémon</h1>
                    <p>Selecciona 6 Pokémon para comenzar tu run</p>
                </div>
                <div class="selection-toolbar">
                    <span id="selectionCount">0 / 6 seleccionados</span>
                    <button id="continueBtn" disabled>Continuar</button>
                </div>
                <div id="pokemonGrid" class="pokebmon-grid"></div>
            </section>
            <section id="itemScreen" class="item-screen hidden">
                <div class="selection-header">
                    <p>EQUIPA A TU EQUIPO</p>
                    <h1>Asigna objetos</h1>
                    <p>Selecciona un Pokémon y después un objeto</p>
                </div>
                <div class="itemlayout">
                    <div>
                        <h2>Tu equipo</h2>
                        <div id="itemTeamGrid" class="item-team-grid"></div>
                    </div>
                    <div>
                        <h2>Objetos disponibles</h2>
                        <div id="itemOfferGrid" class="item-offer-grid"></div>
                    </div>
                </div>
                <button id="startRunBtn">Empezar la run</button>
            </section>
        </main>
        <script type="module" src="./src/js/main.js"></script>
    </body>
</html>
